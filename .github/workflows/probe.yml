name: Probe deployed site
on:
  workflow_dispatch:
  push:
    branches: [sales-autopilot]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.p.outputs.summary }}
      body: ${{ steps.p.outputs.body }}
    steps:
      - id: p
        run: |
          set +e
          BASE="https://forestgreen-narwhal-176171.hostingersite.com"
          H=$(curl -sS -m 30 -o /tmp/h.txt -w '%{http_code}' "$BASE/api/health")
          R=$(curl -sS -m 30 -o /tmp/r.txt -w '%{http_code}' "$BASE/")
          S=$(curl -sS -m 30 -o /tmp/s.txt -w '%{http_code}' "$BASE/api/auth/status")
          A=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "$BASE/app.js")
          TITLE=$(grep -o '<title>[^<]*' /tmp/r.txt | head -1 | cut -c8-60)
          echo "summary=health=$H root=$R status=$S appjs=$A title=[$TITLE]" >> "$GITHUB_OUTPUT"
          BODY=$(tr -d '\n' < /tmp/h.txt | cut -c1-120)" | "$(tr -d '\n' < /tmp/s.txt | cut -c1-80)
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
          cat /tmp/h.txt; echo; cat /tmp/s.txt; echo; head -c 300 /tmp/r.txt
  report:
    needs: probe
    runs-on: ubuntu-latest
    name: "RESULT ${{ needs.probe.outputs.summary }} :: ${{ needs.probe.outputs.body }}"
    steps:
      - run: echo "${{ needs.probe.outputs.summary }}"
