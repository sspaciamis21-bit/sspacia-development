name: Probe deployed site (v4)
on:
  workflow_dispatch:
  push:
    branches: [sales-autopilot]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.p.outputs.summary }}
      body: ${{ steps.p.outputs.body }}
    steps:
      - id: p
        shell: bash
        run: |
          set +e
          BASE="https://forestgreen-narwhal-176171.hostingersite.com"
          REF="https://aquamarine-dragonfly-762973.hostingersite.com"
          W='code=%{http_code} ip=%{remote_ip} dns=%{time_namelookup} con=%{time_connect} tls=%{time_appconnect} tot=%{time_total}'
          H=$(curl -s -m 25 -o /tmp/h.txt -w "$W" "$BASE/api/health" 2>&1); HE=$?
          P=$(curl -s -m 25 -o /dev/null -w "$W" "http://forestgreen-narwhal-176171.hostingersite.com/api/health" 2>&1); PE=$?
          X=$(curl -s -m 25 -o /dev/null -w "$W" "$REF/" 2>&1); XE=$?
          D=$(getent hosts forestgreen-narwhal-176171.hostingersite.com | head -1)
          echo "summary=NEW[$H/$HE] HTTP[$P/$PE] REF[$X/$XE] DNS[$D]" >> "$GITHUB_OUTPUT"
          echo "body=$(tr -d '\n' < /tmp/h.txt 2>/dev/null | cut -c1-150)" >> "$GITHUB_OUTPUT"
          exit 0
  report:
    needs: probe
    runs-on: ubuntu-latest
    name: "RESULT ${{ needs.probe.outputs.summary }} :: ${{ needs.probe.outputs.body }}"
    steps:
      - run: echo done
